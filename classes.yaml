# Source of truth for the fridge detector's classes, the app's pantry categories
# and the OCR keyword dictionary. Everything in exports/fridge-labels-vN.json is
# generated from this file (scripts/export_labels.py).
#
# detect:
#   visual - the detector learns it (gets a model class index)
#   both   - the detector learns it AND OCR can name it (e.g. milk carton vs cream carton)
#   ocr    - no visual class; it only shows up when its label text is read (yogurt, ketchup...)
#
# Detector class indices follow the order of visual/both entries below (1-based;
# index 0 is MediaPipe's implicit "background"). NEVER reorder or delete a released
# class; append new ones and bump `version`, or old app builds will mislabel boxes.
#
# aliases:   extra dataset label names that map onto this class (Roboflow / CVAT exports).
# open_images: Open Images V7 class names to pull boxes for (checked against the
#              real class list by scripts/download_open_images.py).
# ocr:       label keywords per language. Matching is case/accent-insensitive, on
#            whole words, longest phrase wins ("cream cheese" beats "cream").

version: 1

categories:
  dairy_eggs: Dairy & eggs
  meat_fish: Meat, fish & protein
  fruits: Fruits
  vegetables: Vegetables
  sauces: Sauces & condiments
  bakery: Bread & bakery
  drinks: Drinks
  other: Other

# Phrases that consume OCR text without producing an ingredient, so that
# "milk chocolate" doesn't add milk and "peanut butter" doesn't add butter.
ocr_ignore:
  - milk chocolate
  - chocolat au lait
  - chocolate con leche
  - coconut milk
  - lait de coco
  - leche de coco
  - oat milk
  - almond milk
  - soy milk
  - buttermilk
  - butter beans
  - butternut
  - cream crackers
  - ice cream
  - glace
  - helado
  - best before
  - use by
  - keep refrigerated

classes:
  # ---------------------------------------------------------------- dairy & eggs
  - name: egg
    display: Eggs
    category: dairy_eggs
    detect: both
    aliases: [eggs, egg_carton]
    open_images: [Egg (Food)]
    ocr:
      en: [egg, eggs, free range eggs]
      fr: [oeuf, oeufs]
      es: [huevo, huevos]
  - name: milk
    display: Milk
    category: dairy_eggs
    detect: both
    aliases: [milk_carton, milk_bottle]
    open_images: [Milk]
    ocr:
      en: [milk, whole milk, semi skimmed, skimmed milk, skim milk]
      fr: [lait, lait demi ecreme, lait entier, lait ecreme]
      es: [leche, leche entera, leche semidesnatada, leche desnatada]
  - name: cheese
    display: Cheese
    category: dairy_eggs
    detect: both
    aliases: [cheese_block]
    open_images: [Cheese]
    ocr:
      en: [cheese, cheddar, mozzarella, parmesan, feta, halloumi, gouda, brie]
      fr: [fromage, emmental, comte, chevre]
      es: [queso, manchego]
  - name: butter
    display: Butter
    category: dairy_eggs
    detect: both
    ocr:
      en: [butter, salted butter, unsalted butter]
      fr: [beurre, beurre doux, beurre demi sel]
      es: [mantequilla]
  - name: yogurt
    display: Yogurt
    category: dairy_eggs
    detect: ocr
    ocr:
      en: [yogurt, yoghurt, greek yogurt, greek style yoghurt, skyr]
      fr: [yaourt, yogourt, fromage blanc]
      es: [yogur, yogurt griego]
  - name: cream
    display: Cream
    category: dairy_eggs
    detect: ocr
    ocr:
      en: [cream, double cream, single cream, whipping cream, heavy cream]
      fr: [creme, creme liquide, creme entiere]
      es: [nata, nata para montar, crema de leche]
  - name: sour_cream
    display: Sour cream / crème fraîche
    category: dairy_eggs
    detect: ocr
    ocr:
      en: [sour cream, creme fraiche]
      fr: [creme fraiche, creme epaisse]
      es: [crema agria, nata agria]
  - name: cream_cheese
    display: Cream cheese
    category: dairy_eggs
    detect: ocr
    ocr:
      en: [cream cheese, soft cheese]
      fr: [fromage a tartiner, fromage frais]
      es: [queso crema, queso para untar]
  - name: cottage_cheese
    display: Cottage cheese
    category: dairy_eggs
    detect: ocr
    ocr:
      en: [cottage cheese]
      fr: [cottage cheese, fromage cottage]
      es: [requeson, queso cottage]

